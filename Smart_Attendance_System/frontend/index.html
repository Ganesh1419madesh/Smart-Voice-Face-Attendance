<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Smart Attendance | Sign in</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body class="login-page">
    <main class="login-container">
        <section class="login-card" aria-labelledby="login-title">
            <header class="login-header">
                <div class="login-logo" aria-label="Attendance recognition logo">
                    <span class="logo-camera" aria-hidden="true">
                        <span class="logo-lens"></span>
                        <span class="logo-scan"></span>
                    </span>
                    <span class="logo-check" aria-hidden="true"></span>
                </div>
                <h1 id="login-title">Smart Attendance</h1>
                <p>Face and voice attendance, brought together.</p>
            </header>
            <form id="login-form">
                <div class="form-group">
                    <label for="username">Username</label>
                    <input id="username" name="username" autocomplete="username" required>
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input id="password" name="password" type="password" autocomplete="current-password" required>
                </div>
                <div class="form-group">
                    <label for="role">Login as</label>
                    <select id="role" name="role" required>
                        <option value="admin">Admin</option>
                        <option value="staff">Staff</option>
                        <option value="student">Student</option>
                    </select>
                </div>
                <div id="login-error" class="login-error" role="alert"></div>
                <button class="btn-login" type="submit">Sign in</button>
            </form>
            <p class="login-footer">Secure access for attendance administrators</p>
        </section>
    </main>
    <script src="/js/app.js"></script>
</body>
</html>
